# nginx-Site für OpenReply (vor certbot; certbot --nginx ergänzt den TLS-Block).
# Ziel: /etc/nginx/sites-available/openreply + Symlink nach sites-enabled.
# Hostname anpassen, falls nicht go.copypasteceo.com.

server {
    listen 80;
    server_name go.copypasteceo.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
